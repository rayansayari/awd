version: '3.8'

services:
  # =========================================================================
  # Infrastructure Commune (Eureka, Gateway, RabbitMQ)
  # =========================================================================
  discovery-server:
    image: springcloud/eureka
    container_name: carrental-eureka
    ports:
      - "8761:8761"
    networks:
      - carrental-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: carrental-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=carrental
      - RABBITMQ_DEFAULT_PASS=carrentalpass
    networks:
      - carrental-network

  api-gateway:
    build: ./API-Gateway
    container_name: carrental-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    networks:
      - carrental-network

  # =========================================================================
  # Base de Données MySQL 8.0 & Outil d'administration phpMyAdmin
  # =========================================================================
  mysql-server:
    image: mysql:8.0
    container_name: carrental-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - carrental-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: carrental-phpmyadmin
    restart: always
    ports:
      - "8088:80"
    environment:
      PMA_HOST: mysql-server
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - mysql-server
    networks:
      - carrental-network

  # =========================================================================
  # Microservices Métier (Spring Boot 3.2+ avec MySQL & JPA)
  # =========================================================================
  user-service:
    build: ./User-Service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/carrental_user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      - mysql-server
      - discovery-server
    networks:
      - carrental-network

  vehicle-service:
    build: ./Vehicle-Service
    container_name: vehicle-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/carrental_vehicle_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - mysql-server
      - discovery-server
      - rabbitmq
    networks:
      - carrental-network

  reservation-service:
    build: ./Reservation-Service
    container_name: reservation-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/carrental_reservation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - mysql-server
      - discovery-server
      - rabbitmq
    networks:
      - carrental-network

  payment-service:
    build: ./Payment-Service
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/carrental_payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - mysql-server
      - discovery-server
      - rabbitmq
    networks:
      - carrental-network

  agency-service:
    build: ./Agency-Service
    container_name: agency-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/carrental_agency_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      - mysql-server
      - discovery-server
    networks:
      - carrental-network

  review-service:
    build: ./Review-Service
    container_name: review-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/carrental_review_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      - mysql-server
      - discovery-server
    networks:
      - carrental-network

networks:
  carrental-network:
    driver: bridge

volumes:
  mysql_data:
